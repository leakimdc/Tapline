<!DOCTYPE html>
<html>
<head>
    <title>FONT Tag Attributes</title>
</head>
<body>
    <h2>Showcasing the FONT Tag</h2>

    <font face="Arial" size="5" color="blue">
        This text uses Arial font, size 5, in blue color.
    </font>
    <br><br>

    <font face="Times New Roman" size="4" color="green">
        This text uses Times New Roman font, size 4, in green color.
    </font>
    <br><br>

    <font face="Courier New" size="6" color="red">
        This text uses Courier New font, size 6, in red color.
    </font>
    <br><br>

    <font face="Verdana" size="3" color="purple">
        This text uses Verdana font, size 3, in purple color.
    </font>

</body>
</html>
