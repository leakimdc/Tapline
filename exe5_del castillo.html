<!DOCTYPE html>
<html>
<head>
    <title>Formatting Tags</title>
</head>
<body>
    <h2 style="color:green;">Sample Output:</h2>

    <p><i style="color:red;"><b>Italic</b></i></p>

    <p><u style="color:red;">Underline</u></p>

    <p><b style="color:blue;">Bold</b></p>

    <p><strike style="color:purple;">Strikethrough</strike></p>

    <p><sup style="color:orange;">Superscript</sup></p>

    <p><sub style="color:brown;">Subscript</sub></p>

    <p><small style="color:teal;">Small Text</small></p>

    <p><big style="color:darkgreen;">Big Text</big></p>

</body>
</html>
