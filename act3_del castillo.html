<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity No. 3 - Photo Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #dff3ff, #ffffff, #d9ecff);
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            text-align: center;
            color: #063b72;
            margin: 25px 0 8px;
            text-shadow: 1px 2px 3px #aaa;
        }

        .subtitle {
            text-align: center;
            color: #35627f;
            margin-bottom: 25px;
        }

        /* 5 columns x 4 rows, centered */
        .gallery {
            width: 1040px;
            margin: 0 auto 35px;
            display: grid;
            grid-template-columns: repeat(5, 200px);
            grid-template-rows: repeat(4, 200px);
            gap: 10px;
            justify-content: center;
            align-content: center;
        }

        .photo {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border: 4px solid white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .photo:hover {
            transform: scale(1.04);
            box-shadow: 0 7px 16px rgba(0, 0, 0, 0.35);
        }

        .footer {
            text-align: center;
            color: #31556e;
            padding: 10px 0 30px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>Nature Photo Gallery</h1>
    

    <div class="gallery">
        <img class="photo" src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=400&h=400&q=80" alt="Nature landscape">
        <img class="photo" src="https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&w=400&h=400&q=80" alt="Mountain landscape">
        <img class="photo" src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=400&h=400&q=80" alt="Forest landscape">
        <img class="photo" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=400&h=400&q=80" alt="Green forest">
        <img class="photo" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=400&h=400&q=80" alt="Lake and mountains">

        <img class="photo" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=400&h=400&q=80" alt="Mountain peaks">
        <img class="photo" src="https://images.unsplash.com/photo-1439853949127-fa647821eba0?auto=format&fit=crop&w=400&h=400&q=80" alt="Mountain lake">
        <img class="photo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQH0hppLvT9ytzsWb5IHMHEU661bbe4YBUCIQz6UyZbGfaflUzj6SVgOrQ8&s=10" alt="Forest trees">
        <img class="photo" src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=400&h=400&q=80" alt="Sunlight through forest">
        <img class="photo" src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=400&h=400&q=80" alt="Tall forest">

        <img class="photo" src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=400&h=400&q=80" alt="Mountain valley">
        <img class="photo" src="https://images.unsplash.com/photo-1486911278844-a81c5267e227?auto=format&fit=crop&w=400&h=400&q=80" alt="Ocean waves">
        <img class="photo" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=400&h=400&q=80" alt="Tropical beach">
        <img class="photo" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=400&h=400&q=80" alt="Outdoor landscape">
        <img class="photo" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=400&h=400&q=80" alt="Mountain lake">

        <img class="photo" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=400&h=400&q=80" alt="Mountain scenery">
        <img class="photo" src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=400&h=400&q=80" alt="Green hills">
        <img class="photo" src="https://images.unsplash.com/photo-1433086966358-54859d0ed716?auto=format&fit=crop&w=400&h=400&q=80" alt="Waterfall">
        <img class="photo" src="https://images.unsplash.com/photo-1428908728789-d2de25dbd4e2?auto=format&fit=crop&w=400&h=400&q=80" alt="Sunset landscape">
        <img class="photo" src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?auto=format&fit=crop&w=400&h=400&q=80" alt="Colorful flowers">
    </div>

    <div class="footer">
        
    </div>

</body>
</html>
