<!DOCTYPE html>
<html>
<head>
    <title>My Favorite Poem</title>
    <style>
        body {
            background-color: #a8d0e6;
            font-family: "Times New Roman", Times, serif;
            margin: 40px;
        }
        .poem-box {
            background-color: #ffffff;
            border: 2px solid #003366;
            border-radius: 10px;
            padding: 25px;
            max-width: 600px;
            margin: 20px auto;
            box-shadow: 3px 3px 10px gray;
        }
    </style>
</head>
<body>

    <h1 align="center" style="color:purple;"><u>My Favorite Poem</u></h1>

    <div class="poem-box">
        <p align="center">
            <font size="5" color="purple"><b><i>Im Afraid</i></b></font>
        </p>

        <p align="center">
            <font size="4" color="black">
            
            You say you love rain <i>but you open your umbrella.</i> You say you love the sun,<br>
            but you find a shadow spot. You say you love wind.<br>
            but you close your windows.<br>
            <sup>This is why I am afraid when you say you love me.</sup>
            </font>
        </p>

    

    <hr style="border:1px solid navy; max-width:600px;">

</body>
</html>
