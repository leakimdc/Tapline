<!DOCTYPE html>

    <title>My Favorite Quotes</title>
</head>
<body>
    <h2 align="center">My Favorite Quotes</h2>

    <p align="left" style="color:blue; font-size:20px;">
        "Trees that grow slow grow the best fruit."
        <br>
        <b><i>- Molière</i></b>
    </p>

    <p align="center" style="color:darkgreen; font-size:20px;">
        "Do not go where the path may lead, go instead where there is no path and leave a trail."
        <br>
        <u><b>- Ralph Waldo Emerson</b></u>
    </p>

    <p align="right" style="color:crimson; font-size:20px;">
        "Success is not final, failure is not fatal: it is the courage to continue that counts."
        <br>
        <b><font size="4">- Winston Churchill</font></b>
    </p>

</body>
</html>
