<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exercise 7 - Lists</title>
<style>
    body {
        background-color: #cfe2f3; /* glacial blue */
        font-family: Georgia, 'Times New Roman', serif;
        color: #000;
        padding: 40px;
    }

    h2 {
        font-weight: bold;
    }

    ol, ul {
        font-size: 18px;
        line-height: 1.6;
    }
</style>
</head>
<body>

    <h2>Numbered list:</h2>
    <ol type="1">
        <li>Apples</li>
        <li>Bananas</li>
        <li>Lemons</li>
        <li>Oranges</li>
    </ol>

    <h2>Letters list:</h2>
    <ol type="A">
        <li>Apples</li>
        <li>Bananas</li>
        <li>Lemons</li>
        <li>Oranges</li>
    </ol>

</body>
</html>
